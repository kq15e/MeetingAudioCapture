name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Build
        env:
          CLANG_MODULE_CACHE_PATH: .build/ModuleCache
        run: swift build

      - name: Test
        env:
          CLANG_MODULE_CACHE_PATH: .build/ModuleCache
        run: swift test
