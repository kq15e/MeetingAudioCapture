name: 機能提案
description: 新機能や既存機能の改善を提案します
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 現在どのような不便があるかを記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する変更
      description: 期待する操作や結果を記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 現在使っている回避策や、検討した別案があれば記載してください。

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 何を確認できれば完了と判断できるかを記載してください。
