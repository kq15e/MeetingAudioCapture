name: 不具合報告
description: 録音失敗、クラッシュ、意図しない動作を報告します
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        音声ファイル、会議内容、個人情報、認証情報は添付しないでください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に記載してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が発生するまでの操作を順番に記載してください。
      placeholder: |
        1. オンライン会議モードを選択する
        2. 内蔵マイクを選択する
        3. 録音開始を選択する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: エラー文は省略せず記載してください。
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 発生頻度
      options:
        - 毎回
        - ときどき
        - 一度だけ
        - 不明
    validations:
      required: true

  - type: dropdown
    id: recording-mode
    attributes:
      label: 録音モード
      options:
        - オンライン会議
        - 対面
        - 両方
        - 不明または録音開始前
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: アプリのバージョンまたはコミット
      placeholder: 例：v1.2.0 / b6d3898

  - type: input
    id: macos-version
    attributes:
      label: macOSバージョン
      placeholder: 例：26.4.1
    validations:
      required: true

  - type: textarea
    id: audio-environment
    attributes:
      label: 音声環境
      description: 使用したマイク、オーディオインターフェース、仮想デバイス、会議アプリを記載してください。

  - type: textarea
    id: workaround
    attributes:
      label: 確認済みの回避策
      description: 別のマイクや録音モードでの結果などを記載してください。

  - type: textarea
    id: attachments
    attributes:
      label: 追加情報
      description: 個人情報を除いたスクリーンショットや診断情報を添付できます。

  - type: checkboxes
    id: safety
    attributes:
      label: 情報の取り扱い
      options:
        - label: 添付内容に音声ファイル、会議内容、個人情報、認証情報が含まれていないことを確認しました。
          required: true
